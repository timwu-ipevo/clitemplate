name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke-test the packed tarball the way users will install it.
      - name: Install packed CLI globally
        shell: bash
        run: |
          npm pack
          npm install -g ./clitemplate-*.tgz
          clitemplate --version
          clitemplate greet CI
          clitemplate info
