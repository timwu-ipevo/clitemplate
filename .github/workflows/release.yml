name: Release

# Push a tag matching package.json's version to publish a GitHub release
# with standalone executables attached:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win-x64, ext: .exe }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    env:
      ASSET: clitemplate-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The executable embeds this Node runtime.
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Build executable
        run: npm run build:exe -- --out "release/${{ env.ASSET }}"

      - name: Test executable
        shell: bash
        run: CLI_EXE="$PWD/release/$ASSET" npm test

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum clitemplate-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
